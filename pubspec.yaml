name: selvanathan_chit
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.7    # 👈 Only version stays here

flutter:
  uses-material-design: true

  assets:
    - assets/                      # Your logo/images folder


# 🚀 Splash screen configuration (This must be outside flutter:)
flutter_native_splash:
  color: "#FFFFFF"                 # Background color
  image: assets/logo.png           # Logo/Image on launch screen
  android: true
  ios: true
  web: true
  android_gravity: center
  ios_content_mode: center
